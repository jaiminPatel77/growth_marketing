@if (post) {
  <div
    class="article-dialog-backdrop"
    (click)="handleBackdropClick($event)"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="post.title"
  >
    <div class="article-dialog-modal">
      <button
        type="button"
        class="dialog-close"
        aria-label="Close article"
        (click)="closeDialog.emit()"
      >
        <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
      </button>

      <div class="article-detail-inner">
        <div class="blog-thumb" [class]="post.color">
          @if (post.coverImageUrl) {
            <img class="blog-cover" [src]="post.coverImageUrl" alt="" decoding="async" />
          } @else {
            <svg class="icon" aria-hidden="true"><use [attr.href]="'#i-' + post.icon"></use></svg>
          }
        </div>
        <span class="blog-card-category">{{ post.category }}</span>
        <h2>{{ post.title }}</h2>
        <p class="article-lead">{{ post.excerpt }}</p>

        <p class="blog-byline">
          @if (post.author) { <span>{{ post.author }} &middot; </span> }
          <time [attr.datetime]="post.publishedAt">{{ post.publishedAt | date:"mediumDate":"UTC" }}</time>
        </p>
        <p class="article-content">{{ post.content }}</p>
      </div>
    </div>
  </div>
}
