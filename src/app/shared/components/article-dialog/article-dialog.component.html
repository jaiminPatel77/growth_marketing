@if (post) {
  <div
    class="article-dialog-backdrop"
    (click)="handleBackdropClick($event)"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="post.title"
  >
    <div class="article-dialog-modal">
      <button
        type="button"
        class="dialog-close"
        aria-label="Close article"
        (click)="closeDialog.emit()"
      >
        <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
      </button>

      <div class="article-detail-inner">
        <div class="blog-thumb" [class]="post.color">
          <svg class="icon" aria-hidden="true">
            <use [attr.href]="'#i-' + post.icon"></use>
          </svg>
        </div>
        <span class="blog-card-category">{{ post.category }}</span>
        <h2>{{ post.title }}</h2>
        <p class="article-lead">{{ post.excerpt }}</p>

        @for (section of post.sections; track section.heading) {
          <h3>{{ section.heading }}</h3>
          <p>{{ section.paragraph }}</p>
        }
      </div>
    </div>
  </div>
}
